name: "ComposeTest"
author: "Christoph"
status: "FINAL"
description: Sample test in XML
actions:
  - testcontainers:
      compose:
        up:
          file: "classpath:org/citrusframework/testcontainers/integration/compose/compose.yaml"
          exposedServices:
            - name: "web-1"
              port: 80
  - waitFor:
      http:
        url: "http://${CITRUS_TESTCONTAINERS_WEB_1_SERVICE_HOST}:${CITRUS_TESTCONTAINERS_WEB_1_SERVICE_PORT}"
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_WEB_1_SERVICE_HOST}:${CITRUS_TESTCONTAINERS_WEB_1_SERVICE_PORT}"
      sendRequest:
        GET: {}
  - http:
      client: "http://${CITRUS_TESTCONTAINERS_WEB_1_SERVICE_HOST}:${CITRUS_TESTCONTAINERS_WEB_1_SERVICE_PORT}"
      receiveResponse:
        response:
          status: "200"
          reasonPhrase: "OK"
          body:
            resource:
              file: "classpath:org/citrusframework/testcontainers/integration/compose/html/index.html"
finally:
  - testcontainers:
      compose:
        down: {}

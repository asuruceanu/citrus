name: citrus-test-distribution

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: citrus_dist
      POSTGRES_USER: citrus
      POSTGRES_PASSWORD: ${CITRUS_DIST_JDBC_PASSWORD:-citrus}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  coordinator:
    build:
      context: ../../..
      dockerfile: tools/citrus-test-distribution/docker/Dockerfile
      target: coordinator
    command:
      - --jdbc-url=jdbc:postgresql://postgres:5432/citrus_dist
      - --cache-dir=/var/lib/citrus/blobs
    environment:
      CITRUS_DIST_JDBC_USER: citrus
      CITRUS_DIST_JDBC_PASSWORD: ${CITRUS_DIST_JDBC_PASSWORD:-citrus}
      CITRUS_DIST_AUTH_TOKEN: ${CITRUS_DIST_AUTH_TOKEN:-}
    ports:
      - "127.0.0.1:${CITRUS_DIST_HOST_PORT:-8765}:8765"
    volumes:
      - coordinator-data:/var/lib/citrus
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8765/health"]
      interval: 2s
      timeout: 3s
      retries: 20
    init: true
    restart: unless-stopped

  worker:
    build:
      context: ../../..
      dockerfile: tools/citrus-test-distribution/docker/Dockerfile
      target: worker
    environment:
      CITRUS_DIST_COORDINATOR_URL: http://coordinator:8765
      CITRUS_DIST_AUTH_TOKEN: ${CITRUS_DIST_AUTH_TOKEN:-}
      CITRUS_DIST_WORKER_CAPABILITIES: ${CITRUS_DIST_WORKER_CAPABILITIES:-}
    depends_on:
      coordinator:
        condition: service_healthy
    scale: ${CITRUS_DIST_WORKERS:-8}
    stop_grace_period: 65s
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
  coordinator-data:

name: sync-upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

jobs:
  sync:
    if: github.repository == 'asuruceanu/citrus'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout fork repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fast-forward fork main from upstream and open sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/citrusframework/citrus.git
          git fetch --no-tags upstream main
          git fetch --no-tags origin main incubator/test-distribution

          if ! git merge-base --is-ancestor refs/remotes/origin/main refs/remotes/upstream/main; then
            echo "::error::fork main has diverged from citrusframework/citrus:main; refusing non-fast-forward update."
            exit 1
          fi

          if [ "$(git rev-parse refs/remotes/origin/main)" != "$(git rev-parse refs/remotes/upstream/main)" ]; then
            git push origin refs/remotes/upstream/main:refs/heads/main
          fi

          if git merge-base --is-ancestor refs/remotes/upstream/main refs/remotes/origin/incubator/test-distribution; then
            echo "incubator/test-distribution already contains upstream/main."
            exit 0
          fi

          git push --force-with-lease origin refs/remotes/upstream/main:refs/heads/chore/sync-upstream-main

          EXISTING_PR="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --base incubator/test-distribution \
            --head chore/sync-upstream-main \
            --json number,headRefName \
            --jq '.[] | select(.headRefName == "chore/sync-upstream-main") | .number' | head -n 1)"

          UPSTREAM_SHA="$(git rev-parse --short refs/remotes/upstream/main)"
          if [ -z "${EXISTING_PR}" ]; then
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base incubator/test-distribution \
              --head chore/sync-upstream-main \
              --title "chore(sync): merge upstream main (${UPSTREAM_SHA}) into incubator/test-distribution" \
              --body "Automated fast-forward sync of \`citrusframework/citrus:main\` (\`${UPSTREAM_SHA}\`). Merge with **Create a merge commit** (\`--no-ff\`); do not rebase \`incubator/test-distribution\`."
          else
            echo "Updated existing sync PR #${EXISTING_PR} to ${UPSTREAM_SHA}."
          fi
